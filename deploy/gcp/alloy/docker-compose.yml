services:
  alloy:
    image: grafana/alloy:latest
    container_name: mitsubishi-rag-alloy
    command:
      - run
      - /etc/alloy/config.alloy
    env_file:
      - .env
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12345:12345"
    restart: unless-stopped
